name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android MainActivity & Permissions
        run: |
          # Inject Storage, TTS Engine Queries, and Permissions
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" \/>\n        <\/intent>\n    <\/queries>\n    <application/g' android/app/src/main/AndroidManifest.xml

          # Unlock Programmatic Video Playback in Android WebView
          cat << 'EOF' > android/app/src/main/java/com/raj/sentencerepeater/MainActivity.java
          package com.raj.sentencerepeater;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  // In onStart, the WebView is guaranteed to be initialized
                  WebView webView = (WebView) this.bridge.getWebView();
                  if (webView != null) {
                      WebSettings settings = webView.getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setDomStorageEnabled(true);
                      settings.setAllowFileAccess(true);
                  }
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
